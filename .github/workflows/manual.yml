name: Flipbook manual

on:
  pull_request:
    paths:
      - 'Documentation~/**'
      - 'package.json'
      - '.github/workflows/manual.yml'
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'Documentation~/**'
      - 'package.json'
      - '.github/workflows/manual.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF tools and Chinese fonts
        run: |
          python -m pip install -r 'Documentation~/requirements.txt'
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Export the manual for this package version
        id: build
        run: |
          python 'Documentation~/export_manual.py' --output "$RUNNER_TEMP/KingdomTD-Flipbook-Manual.pdf"
          echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: KingdomTD-Flipbook-Manual-v${{ steps.build.outputs.version }}
          path: ${{ runner.temp }}/KingdomTD-Flipbook-Manual.pdf
          if-no-files-found: error
      - name: Verify the PDF linked from the repository
        run: python 'Documentation~/export_manual.py' --check
